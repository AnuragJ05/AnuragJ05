name: Update GitHub Projects

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate projects section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          username = "AnuragJ05"
          result = subprocess.run([
              "gh", "api", f"users/{username}/repos?per_page=100&sort=updated"
          ], capture_output=True, text=True, check=True)
          repos = json.loads(result.stdout)
          repos = [r for r in repos if not r.get("fork") and not r.get("archived")]

          rows = [
              "| Project | Description | Tech Stack |",
              "|---|---|---|"
          ]
          for repo in repos:
              name = repo["name"]
              url = repo["html_url"]
              description = (repo.get("description") or "Personal project / open-source work").replace("|", "\\|").replace("\n", " ")
              language = repo.get("language") or "—"
              topics = repo.get("topics") or []
              tech = ", ".join(topics[:5]) if topics else language
              rows.append(f"| [**{name}**]({url}) | {description} | {tech} |")

          path = "README.md"
          text = open(path, encoding="utf-8").read()
          start = "<!-- PROJECTS:START -->"
          end = "<!-- PROJECTS:END -->"
          generated = start + "\n_This section is automatically updated from my public GitHub repositories._\n\n" + "\n".join(rows) + "\n\n" + end
          before = text.split(start, 1)[0]
          after = text.split(end, 1)[1]
          open(path, "w", encoding="utf-8").write(before + generated + after)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "chore: update project list"
          git push
